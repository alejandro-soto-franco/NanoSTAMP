[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "nanostamp"
version = "0.1.0"
description = "LNP-barcode spot detection and downstream spatial analysis for the NanoSTAMP spleen imaging study."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-image>=0.22,<0.27",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "anndata>=0.10,<0.13",
  "h5py>=3.10,<4",
  "tifffile>=2024.1",
  "pyyaml>=6.0,<7",
]
urls.Homepage = "https://github.com/alejandro-soto-franco/NanoSTAMP"
urls.Source = "https://github.com/alejandro-soto-franco/NanoSTAMP"

[tool.hatch.build.targets.wheel]
packages = [ "src/nanostamp" ]

[tool.pixi.workspace]
channels = [ "conda-forge", "bioconda" ]
platforms = [ "linux-64" ]

[tool.pixi.pypi-dependencies]
nanostamp = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
snakemake-minimal = ">=8.20,<10"
cellpose = ">=4,<5"
pytorch-cpu = "*"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.6"
pyrefly = "*"

[tool.pixi.environments]
default = { features = [ "test", "lint" ], solve-group = "main" }

[tool.pixi.tasks]
smoke = "snakemake -s workflow/Snakefile --configfile config/smoke.yaml --cores 6 -p all_smoke"
all = "snakemake -s workflow/Snakefile --configfile config/config.yaml --cores 6 -p"
dag = "snakemake -s workflow/Snakefile --configfile config/config.yaml --dag | dot -Tsvg > results/dag.svg"
manifest-from-data = "python workflow/scripts/build_data_manifest.py"

[tool.pixi.feature.test.tasks]
test = "pytest tests -q"

[tool.pixi.feature.lint.tasks]
lint = "ruff check src workflow tests && ruff format --check src workflow tests && pyrefly check src workflow tests"

[tool.ruff]
line-length = 100
src = [ "src", "workflow" ]
format.docstring-code-format = true
lint.select = [ "B", "C4", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]

[tool.pyrefly]
project-includes = [ "src", "workflow", "tests" ]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
